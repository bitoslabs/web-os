<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Counter</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <img src="./icon.svg" width="48" height="48" alt="">
    <h1>Example Counter</h1>
    <p>Runs offline with only its packaged files.</p>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">
      <button id="decrease" type="button">Decrease</button>
      <button id="increase" type="button">Increase</button>
    </div>
  </main>
</body>
</html>
